name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m compileall -q scripts mcp-server
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_core.py" -v
      - name: Rating fixture tests (offline good vs bad site)
        run: python -m unittest tests/test_rating.py -v
      - name: Install MCP server dependencies
        run: pip install -r mcp-server/requirements.txt
      - name: Apple Maps token signing test
        run: python -m unittest tests/test_apple_maps.py -v
      - name: MCP server smoke test
        run: python tests/test_mcp_server.py
      - name: Validate JSON manifests
        run: python -c "import json; [json.load(open(f)) for f in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', '.mcp.json')]"

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Extension end-to-end test (good vs bad site, fix, before/after proof)
        run: node extension/tests/e2e.mjs
