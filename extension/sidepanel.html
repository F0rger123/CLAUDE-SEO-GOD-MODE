<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEO God Mode</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"></span>SEO God Mode</div>
    <div id="url" class="url">Open a website, then scan it.</div>
    <button id="scan" class="primary">Scan this page</button>
  </header>

  <div id="notice" class="notice" role="status" hidden></div>

  <section id="scores" class="scores" aria-label="Scores" hidden></section>

  <nav id="tabs" class="tabs" role="tablist" hidden>
    <button data-tab="fix" class="on" role="tab">To fix</button>
    <button data-tab="passed" role="tab">Passing</button>
    <button data-tab="proof" role="tab">Before/after</button>
    <button data-tab="prompt" role="tab">Claude</button>
  </nav>

  <main>
    <section id="tab-fix" class="tab"></section>
    <section id="tab-passed" class="tab" hidden></section>
    <section id="tab-proof" class="tab" hidden></section>
    <section id="tab-prompt" class="tab" hidden></section>
  </main>

  <footer>Scans run in your browser and nothing is sent anywhere. Scores rate page health and AI-search readiness, not rankings.
    Part of <a href="https://github.com/F0rger123/CLAUDE-SEO-GOD-MODE" target="_blank" rel="noopener">CLAUDE SEO GOD MODE</a>.</footer>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
